services:

  planocontadb:
    container_name: planocontadb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN458954215
    ports:
      - "1433:1433"
    restart: always
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SwN458954215", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s      

  planocontahandson.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=planocontadb;Database=ContasDB;User Id=sa;Password=SwN458954215;Encrypt=False;TrustServerCertificate=True
      - Otel__ServiceName=PlanoContasAPI
      - Otel__OtlpEndpoint=http://localhost:4317
    depends_on:
      planocontadb:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s 

  prometheus:
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      planocontahandson.api:
        condition: service_healthy

  grafana:
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"    

volumes:
  sql-data:
    driver: local

